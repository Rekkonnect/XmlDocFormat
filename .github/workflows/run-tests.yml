name: run-tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  run:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Build Solution
      shell: pwsh
      run: ./tools/scripts/build-init.ps1

    - name: Run All Tests
      run: dotnet test --solution ./
